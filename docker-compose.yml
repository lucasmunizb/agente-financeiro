# =====================================================================
# Ambiente de DESENVOLVIMENTO — 3 contêineres (app, worker, postgres).
# Código via bind-mount; tudo roda em contêiner (nada no host além do make).
# Produção: ver docker-stack.yml (Docker Swarm + Docker Secrets, sem .env).
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    image: financeiro-app:dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    image: financeiro-app:dev
    restart: unless-stopped
    env_file: .env
    # Worker dedicado e escalável (réplicas independentes do app).
    # Scheduler em background + fila em foreground.
    command: sh -c "php artisan schedule:work & exec php artisan queue:work --tries=3 --timeout=120 --sleep=2"
    volumes:
      - .:/app
    # O worker não serve HTTP; desliga o healthcheck herdado da imagem
    # FrankenPHP (que checa o admin do Caddy em :2019).
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  # Ferramenta de build de assets (Vite/Tailwind). Não faz parte do runtime:
  # roda sob demanda (`make assets` / `make npm` / `make vite`) via `docker
  # compose run`, mantendo a imagem `app` (FrankenPHP) enxuta, sem Node.
  # O profile `tools` impede que suba junto com `make up`.
  node:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
    # Vite dev server (HMR) quando rodar `make vite`; ignorado no build.
    ports:
      - "${VITE_PORT:-5173}:5173"

  # Túnel HTTPS público (Cloudflare Quick Tunnel) para expor o webhook do
  # Telegram em DEV — sem instalar nada no host (regra 9). Fica no profile
  # `tools`: não sobe com `make up` sozinho; é orquestrado por `make webhook-up`
  # (quando há TELEGRAM_BOT_TOKEN) e derrubado por `make down`/`webhook-down`.
  # Aponta direto para o app na rede do compose; a URL pública sai nos logs.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tools"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: financeiro_pgdata
