# =====================================================================
# Ambiente de DESENVOLVIMENTO — 3 contêineres (app, worker, postgres).
# Código via bind-mount; tudo roda em contêiner (nada no host além do make).
# Produção: ver docker-stack.yml (Docker Swarm + Docker Secrets, sem .env).
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    image: financeiro-app:dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    image: financeiro-app:dev
    restart: unless-stopped
    env_file: .env
    # Worker dedicado e escalável (réplicas independentes do app).
    # Scheduler em background + fila em foreground.
    command: sh -c "php artisan schedule:work & exec php artisan queue:work --tries=3 --timeout=120 --sleep=2"
    volumes:
      - .:/app
    # O worker não serve HTTP; desliga o healthcheck herdado da imagem
    # FrankenPHP (que checa o admin do Caddy em :2019).
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: financeiro_pgdata
